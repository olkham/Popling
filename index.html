<style>
@font-face{font-family:"Press Start 2P";font-style:normal;font-weight:400;font-display:swap;
  src:url("./fonts/press-start-2p-latin-400-normal.woff2") format("woff2")}
:root{--bg:#ece6f5;--ink:#2a1f3d;--muted:#6b5f80;--bezel:#1b1328;--rim:#e0508f;--btn:#2a1f3d;--btn-ink:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#120c1d;--ink:#efe9ff;--muted:#a397bd;--bezel:#05030a;--rim:#ff7ab3;--btn:#2b2140;--btn-ink:#fff}}
:root[data-theme="dark"]{--bg:#120c1d;--ink:#efe9ff;--muted:#a397bd;--bezel:#05030a;--rim:#ff7ab3;--btn:#2b2140;--btn-ink:#fff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.bar{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 4px;font-size:11px}
.brand{display:flex;align-items:center;gap:9px}
.brand i{display:block;width:13px;height:13px;border-radius:50%;border:2px solid var(--rim);position:relative}
.brand i::after{content:"";position:absolute;left:2px;top:2px;width:3px;height:3px;background:var(--rim)}
.tools button{font:inherit;font-size:10px;background:var(--btn);color:var(--btn-ink);border:0;border-radius:8px;width:38px;height:32px;margin-left:6px;cursor:pointer}
.tools button[hidden]{display:none}
.tools button svg{display:block;margin:0 auto}
#hint{position:fixed;left:50%;top:calc(52px + env(safe-area-inset-top));transform:translateX(-50%);max-width:min(340px,calc(100vw - 32px));background:var(--btn);color:var(--btn-ink);font-size:9px;line-height:1.8;padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:10;text-align:center}
#hint[hidden]{display:none}
.tools button:focus-visible{outline:2px solid var(--rim);outline-offset:2px}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#0a0614;border-radius:3px;box-shadow:0 0 0 4px var(--bezel),0 0 0 6px var(--rim),0 16px 40px rgba(0,0,0,.35);touch-action:none}
.help{margin:0;padding:8px 12px calc(12px + env(safe-area-inset-bottom));text-align:center;font-size:8px;line-height:2;color:var(--muted)}
#touch{display:none;justify-content:space-between;align-items:center;gap:8px;padding:10px 10px calc(18px + env(safe-area-inset-bottom));touch-action:none}
body.touch #touch{display:flex}
body.touch .help{display:none}
#touch button{font:inherit;border:0;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;padding:0}
.dpad{display:flex;background:var(--btn);border-radius:48px;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.dpad button{width:min(88px,21.5vw);height:min(84px,21vw);background:transparent;font-size:22px}
.dpad button+button{border-left:2px solid rgba(255,255,255,.14)}
.acts{display:flex;gap:10px;align-items:flex-start;height:min(110px,27vw)}
.acts button{width:min(86px,21.5vw);height:min(86px,21.5vw);border-radius:50%;font-size:8px;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.acts .b{background:#1f9e93;margin-top:min(24px,5.5vw)}
.acts .a{background:#d6437f}
#touch button.on{filter:brightness(1.3);transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.dpad button.on{background:rgba(255,255,255,.12)}
@media (orientation: landscape){
  body.touch{--side:clamp(140px,25vw,220px);--sl:calc(var(--side) + env(safe-area-inset-left));--sr:calc(var(--side) + env(safe-area-inset-right));display:grid;grid-template-columns:var(--sl) minmax(0,1fr) var(--sr);grid-template-rows:minmax(0,1fr)}
  body.touch .bar{position:fixed;top:0;left:0;right:0;z-index:3;padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(14px + env(safe-area-inset-left));pointer-events:none}

  body.touch #stage{grid-column:2;grid-row:1;padding:8px 2px calc(8px + env(safe-area-inset-bottom))}
  body.touch #touch{position:fixed;inset:0;display:grid;grid-template-columns:var(--sl) minmax(0,1fr) var(--sr);align-items:end;padding:0 0 calc(max(16px,10vh) + env(safe-area-inset-bottom));pointer-events:none;gap:0}

  body.touch .acts .b{margin-top:min(30px,calc(var(--side) / 6))}

</style>

  b.hitWall=0;

  const nx=b.x+b.vx;
  if(nx<16){b.x=16;b.hitWall=-1;}
  else if(nx>W-32){b.x=W-32;b.hitWall=1;}
  else if(b.vx&&!inside&&solidBox(nx+3,b.y+8,10,7)){b.hitWall=b.vx>0?1:-1;}
  else b.x=nx;
  b.vy=Math.min(b.vy+GRAV,MAXFALL);
  const oldFeet=b.y+16;b.y+=b.vy;b.onGround=false;
  if(b.vy>=0){const r=landRow(b.x,oldFeet,b.y+16);if(r>=0){b.y=r*T-16;b.vy=0;b.onGround=true;}}
  else if(b.y+2<T&&b.y+2>-6){const c0=Math.floor((b.x+4)/T),c1=Math.floor((b.x+11)/T);for(let c=c0;c<=c1;c++)if(grid[c]){b.y=T-2;b.vy=0;break;}}
  if(b.y>PH)b.y-=PH+16;else if(b.y<-16)b.y+=PH+16;
}
const eBox=e=>e.small?[e.x+4,e.y+6,8,9]:[e.x+2,e.y+2,12,13];
const rectHit=(ax,ay,aw,ah,bx,by,bw,bh)=>ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;
function circRect(cx,cy,r,x,y,w,h){const nx=clamp(cx,x,x+w),ny=clamp(cy,y,y+h),dx=cx-nx,dy=cy-ny;return dx*dx+dy*dy<r*r;}

/* ---------- effects & score ---------- */
function burst(x,y,col,n){n=n||8;for(let i=0;i<n;i++){const a=i/n*Math.PI*2+rng()*0.4,s=0.8+rng()*0.9;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:14+rng()*8,col});}}
function floatText(x,y,s,col){texts.push({x,y,s:String(s),col:col||'#fff',t:70});}
function addScore(n,p){
  p=p||players[0];if(!p)return;
  p.score+=n;if(p.score>hi)hi=p.score;
  while(p.score>=p.nextExtra){p.lives++;p.nextExtra+=p.nextExtra<100000?70000:100000;sfx.extra();floatText(p.x+8,p.y-4,'1UP','#8ef5b0');}
}
function updateFx(){
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vx*=0.94;p.vy*=0.94;p.t--;}
  parts=parts.filter(p=>p.t>0);
  for(const t of texts){t.y-=0.35;t.t--;}
  texts=texts.filter(t=>t.t>0);
}

/* ---------- player ---------- */
function updatePlayer(p){
  if(p.out)return;
  const input=pin[p.id];
  if(p.dead){p.deadT++;if(p.deadT>40){p.vy=Math.min(p.vy+0.15,3);p.y+=p.vy;}if(p.deadT>130)afterDeath(p);return;}
  const dir=(input.right?1:0)-(input.left?1:0);
  p.vx=dir*(p.shoe?1.6:1.15);if(dir)p.face=dir;
  if(input.jumpPressed)p.jumpBuf=7;else if(p.jumpBuf>0)p.jumpBuf--;
  if(p.onGround)p.coyote=6;else if(p.coyote>0)p.coyote--;
  if(p.jumpBuf>0&&p.coyote>0){p.vy=JUMPV;p.jumpBuf=0;p.coyote=0;sfx.jump();}
  moveBody(p);
  if(dir&&p.onGround)p.anim+=0.16;
  if(p.fireCd>0)p.fireCd--;if(p.blow>0)p.blow--;
  if(input.firePressed&&p.fireCd<=0){shootBubble(p);p.fireCd=p.pink?7:15;p.blow=10;}
  if(p.inv>0)p.inv--;
}
function killPlayer(p){
  if(p.dead||p.inv>0||p.out)return;
  p.dead=true;p.deadT=0;p.vy=-2.5;sfx.die();burst(p.x+8,p.y+8,p.id?'#7ec8ff':'#4fd18b',10);
}
function afterDeath(p){
  p.lives--;
  if(p.lives<=0){p.lives=0;p.out=true;p.dead=false;if(players.every(q=>q.out))gameOver();return;}
  resetPlayerPos(p);p.inv=150;p.shoe=p.blue=p.pink=false;
  chaser=null;shots=[];levelTime=0;hurry=false;banner=null;
}
function shootBubble(p){
  const cx=p.x+8+p.face*9,cy=p.y+8;
  const b={cx,cy,vx:p.face*3.6,vy:0,mode:'shot',dist:0,range:p.blue?104:58,age:0,life:560+rng()*140,enemy:null,pend:-1,chain:null,wob:rng()*6.28,popped:false,escapeAt:0,kind:'n',owner:p};
  if(cx<24||cx>W-24){b.cx=clamp(cx,24,W-24);b.mode='float';}
  bubbles.push(b);sfx.shoot();
  if(++fired%12===0&&!clearing&&bubbles.length<26)spawnSpecial();
}

/* ---------- bubbles ---------- */
function airVel(x,y){
  const a=air;
  if(a.t==='loop'){
    const cx=W/2,cy=PH*0.46,rx=x-cx,ry=(y-cy)*1.35,d=Math.hypot(rx,ry)||1,s=0.42*(a.dir||1),pull=(72-d)*0.004;
    return [(-ry/d)*s+rx/d*pull,(rx/d)*s*0.7+ry/d*pull];
  }
  const ty=a.r*T,tx=a.t==='split'?(x<W/2?5*T:W-5*T):a.c*T;
  const dx=tx-x,dy=ty-y;
  if(dy<-10)return [clamp(dx*0.006,-0.2,0.2),-0.42];
  if(dy>10)return [clamp(dx*0.006,-0.2,0.2),0.34];
  return [clamp(dx*0.02,-0.4,0.4),clamp(dy*0.05,-0.3,0.3)];
}
function spawnSpecial(){
  const kind=['fire','bolt','water'][Math.floor(rng()*3)],side=rng()<0.5?-1:1;
  bubbles.push({cx:side<0?26:W-26,cy:56+rng()*110,vx:0,vy:0,mode:'float',dist:0,range:0,age:0,life:900,
    enemy:null,pend:-1,chain:null,wob:rng()*6.28,popped:false,escapeAt:0,kind});
}
function trap(b,e){
  if(e.bottle){e.bottle.dead=true;e.bottle=null;}
  b.enemy=e;b.mode='float';
  b.escapeAt=b.age+Math.max(240,(e.angry?380:560)-level*8);
  addScore(10,b.owner);sfx.trap();
}
function escape(b){
  const e=b.enemy;b.enemy=null;b.popped=true;
  e.x=clamp(b.cx-8,16,W-32);e.y=b.cy-8;e.vx=0;e.vy=0;e.angry=true;
  if(e.type==='fly'){e.vx=rng()<0.5?-0.6:0.6;e.vy=0.6;}
  enemies.push(e);burst(b.cx,b.cy,'#ff5a7a',6);sfx.escape();
}
function popBubble(b,chain){
  if(b.popped)return;b.popped=true;chain=chain||{kills:0,owner:b.owner||players[0]};
  if(b.enemy){
    slay(b.enemy,b.cx,b.cy,chain);burst(b.cx,b.cy,'#ffffff',10);sfx.kill();
    b.enemy=null;
  }else if(b.kind==='fire'){
    for(let i=0;i<3;i++)fires.push({x:b.cx-8+(i-1)*7,y:b.cy-8,vx:(i-1)*0.55,vy:-1.1+i*0.25,chain});
    burst(b.cx,b.cy,'#ff9a3c',12);sfx.fire();
  }else if(b.kind==='bolt'){
    for(const d of [-1,1])bolts.push({x0:b.cx,x:b.cx,y:b.cy,dir:d,t:0,chain});
    burst(b.cx,b.cy,'#ffe14d',12);sfx.bolt();
  }else if(b.kind==='water'){
    waters.push({x:clamp(b.cx,20,W-20),y:b.cy,dir:b.cx<W/2?1:-1,t:0,trail:[],carry:[],chain});
    burst(b.cx,b.cy,'#7ec8ff',12);sfx.water();
  }else{addScore(10,chain.owner);burst(b.cx,b.cy,'#7ee8ff',6);sfx.pop();}
  for(const o of bubbles){if(o===b||o.popped||o.pend>0||o.mode==='shot')continue;if(Math.hypot(o.cx-b.cx,o.cy-b.cy)<17){o.pend=5;o.chain=chain;}}
}
function slay(e,cx,cy,chain){
  chain.kills++;killEnemy(e,cx,cy,chain.kills,chain.owner);
  if(chain.kills>=2){const bonus=1000*(1<<Math.min(6,chain.kills-2));addScore(bonus,chain.owner);floatText(cx,cy-12,bonus,'#ffd23f');}
}
function killEnemy(e,cx,cy,k,owner){
  if(e.type==='split'&&!e.small){
    for(const d of [-1,1]){
      const n=makeEnemy('split',3,3);
      Object.assign(n,{small:true,x:clamp(cx-8+d*9,16,W-32),y:cy-8,vx:d*0.9,vy:-2,face:d,angry:e.angry,timer:30});
      enemies.push(n);
    }
    burst(cx,cy,'#ff6fd1',10);addScore(100,owner);return;
  }
  const fi=Math.min(FRUIT.length-1,(k-1)+Math.floor((level-1)/4));
  deads.push({x:clamp(cx-8,16,W-32),y:cy-8,vx:(rng()<0.5?-1:1)*(0.6+rng()*1.3),vy:-3.4,t:0,type:e.type,fruit:fi});
}
function updateBubbles(){
  const topY=20;
  for(const b of bubbles){
    if(b.popped)continue;
    b.age++;
    if(b.pend>0){b.pend--;if(b.pend===0)popBubble(b,b.chain);continue;}
    if(b.mode==='shot'){
      b.cx+=b.vx;b.dist+=Math.abs(b.vx);
      if(b.cx<24){b.cx=24;b.mode='float';}else if(b.cx>W-24){b.cx=W-24;b.mode='float';}
      if(b.dist>=b.range)b.mode='float';
      for(let i=0;i<enemies.length;i++){const e=enemies[i],eb=eBox(e);if(circRect(b.cx,b.cy,8,eb[0],eb[1],eb[2],eb[3])){enemies.splice(i,1);trap(b,e);break;}}
    }else{
      b.wob+=0.045;
      const [tvx,tvy]=airVel(b.cx,b.cy);
      b.fx=(b.fx||0)+(tvx-(b.fx||0))*0.08;b.fy=(b.fy||0)+(tvy-(b.fy||0))*0.08;
      b.cx+=b.fx+Math.sin(b.wob)*0.1;b.cy+=b.fy;
      b.cx=clamp(b.cx,24,W-24);b.cy=clamp(b.cy,12,PH-12);
      if(b.enemy){if(b.age>=b.escapeAt)escape(b);}
      else if(b.age>=b.life){b.popped=true;burst(b.cx,b.cy,'#7ee8ff',4);}
    }
  }
  for(let i=0;i<bubbles.length;i++){
    const a=bubbles[i];if(a.popped||a.mode==='shot')continue;
    for(let j=i+1;j<bubbles.length;j++){
      const b=bubbles[j];if(b.popped||b.mode==='shot')continue;
      let dx=b.cx-a.cx,dy=b.cy-a.cy,d=Math.hypot(dx,dy);
      if(d<14){if(d<0.01){dx=rng()-0.5;dy=rng()-0.5;d=Math.hypot(dx,dy);}const push=(14-d)*0.08;dx/=d;dy/=d;a.cx-=dx*push;a.cy-=dy*push;b.cx+=dx*push;b.cy+=dy*push;}
    }
  }
  for(const b of bubbles){b.cx=clamp(b.cx,24,W-24);if(b.cy<12)b.cy=12;}
  bubbles=bubbles.filter(b=>!b.popped);
}
function bubblePlayer(){
  for(const p of players){
    if(p.dead||p.out)continue;
    for(const b of bubbles){
      if(b.popped||b.pend>0||(b.mode==='shot'&&b.age<10))continue;
      if(!circRect(b.cx,b.cy,7,p.x+3,p.y+2,10,14))continue;
      if(p.vy>=0&&p.y+16<=b.cy+1&&pin[p.id].jump){p.vy=JUMPV*0.92;p.y=b.cy-24;b.cy+=1.5;sfx.bounce();}
      else popBubble(b,{kills:0,owner:p});
    }
  }
}

/* ---------- enemies ---------- */
function platformAbove(e){
  const r0=Math.floor((e.y+16)/T),c0=Math.floor((e.x+4)/T),c1=Math.floor((e.x+11)/T);
  for(let r=r0-3;r>=Math.max(1,r0-6);r--)for(let c=c0;c<=c1;c++)if(grid[r*COLS+c])return true;
  return false;
}
function updateEnemy(e){
  const player=nearestPlayer(e.x,e.y);
  const sp=(e.angry?1.7:1)*(1+Math.min(level,30)*0.012);
  e.anim+=0.08*sp;
  if(e.type==='walk'||e.type==='shoot'||e.type==='charge'||e.type==='throw'||e.type==='split'||e.type==='ghost'||e.type==='boom'){
    if(e.onGround){
      const base={walk:0.55,shoot:0.62,charge:0.45,throw:0.4,split:e.small?0.85:0.35,ghost:0.5,boom:0.72}[e.type];
      e.vx=e.face*base*sp;
      if(e.type==='charge'){
        if(e.dash>0){e.dash--;e.vx=e.face*2.3*sp;}
        else if(e.wind>0){e.vx=0;if(--e.wind===0){e.dash=48;sfx.dash();}}
        else if(!player.dead&&Math.abs(player.y-e.y)<10&&Math.sign(player.x-e.x)===e.face&&Math.abs(player.x-e.x)<112){e.wind=18;}
      }
      if(e.type==='throw'&&--e.cd<=0&&!player.dead&&Math.abs(player.x-e.x)<130&&Math.sign(player.x-e.x)===e.face){
        shots.push({x:e.x+8,y:e.y+3,vx:e.face*1.25*(e.angry?1.3:1),vy:-2.5,g:0.11});e.cd=150+rng()*90;e.anim=0;sfx.spit();
      }
      if(e.edgeCd>0)e.edgeCd--;
      const ax=e.face>0?e.x+13:e.x+2,c=Math.floor(ax/T),r=Math.floor((e.y+16)/T);
      const ground=r>=0&&r<ROWS&&grid[r*COLS+c];
      if(!ground&&e.edgeCd<=0&&e.dash<=0){if(rng()>(player.y>e.y+8?0.75:0.25))e.face=-e.face;e.edgeCd=40;}
      if(e.dash<=0&&player.y+8<e.y&&rng()<(e.type==='shoot'?0.004:0.012)*sp&&platformAbove(e))e.vy=JUMPV;
      if(e.dash<=0&&e.wind<=0&&rng()<0.004)e.face=player.x>e.x?1:-1;
      if(e.type==='shoot'){
        e.cd--;
        if(e.cd<=0&&!player.dead&&Math.abs(player.y-e.y)<10&&Math.sign(player.x-e.x)===e.face){
          shots.push({x:e.x+8+e.face*6,y:e.y+8,vx:e.face*1.8*(e.angry?1.4:1)});e.cd=140+rng()*80;sfx.spit();
        }
      }
    }
    if(e.type==='boom'&&!e.bottle&&--e.cd<=0&&!player.dead&&Math.abs(player.y-e.y)<26){
      const sh={x:e.x+8,y:e.y+6,vx:e.face*2.2*(e.angry?1.25:1),boom:true,owner:e};
      shots.push(sh);e.bottle=sh;e.cd=210+rng()*140;sfx.spit();
    }
    if(e.type==='ghost'&&e.onGround){
      if(e.wind>0){e.vx=0;if(--e.wind===0){shots.push({x:e.x+8+e.face*9,y:e.y+12,vx:e.face*1.6*(e.angry?1.35:1),rock:true});sfx.spit();}}
      else if(--e.cd<=0&&!player.dead&&Math.abs(player.y-e.y)<10&&Math.sign(player.x-e.x)===e.face){e.wind=22;e.cd=170+rng()*110;}
    }
    moveBody(e);if(e.hitWall){e.face=-e.hitWall;e.dash=0;e.wind=0;}
  }else if(e.type==='hop'){
    if(e.onGround){e.vx=0;e.timer-=sp;if(e.timer<=0){e.face=player.x>e.x?1:-1;e.vy=-(3.2+rng()*1.4);e.vx=e.face*(0.7+rng()*0.5)*sp;e.timer=50+rng()*50;}}
    moveBody(e);if(e.hitWall){e.vx=-e.vx;e.face=-e.face;}
  }else if(e.type==='run'){
    e.vx=e.face*0.9*sp;
    moveBody(e);
    if(e.hitWall)e.face=-e.hitWall;
    if(--e.cd<=0){shots.push({x:e.x+8,y:e.y+15,vx:0,vy:2.2,laser:true});e.cd=150+rng()*110;sfx.spit();}
  }else if(e.type==='ball'){
    if(!e.vx)e.vx=e.face*0.6;
    e.vx=Math.sign(e.vx)*0.6*sp;
    if(e.onGround){e.vy=-3.4;if(rng()<0.06)e.vx=-e.vx;}
    moveBody(e);
    if(e.hitWall)e.vx=Math.abs(e.vx)*(e.hitWall<0?1:-1);
    e.face=e.vx>0?1:-1;
  }else if(e.type==='dive'){
    const s=0.45*sp;
    if(--e.timer<=0){
      e.timer=90+rng()*120;
      const bias=rng()<0.35;
      e.dx=bias?Math.sign(player.x-e.x):(rng()<0.5?-1:1);
      e.dy=bias?Math.sign(player.y-e.y):(rng()<0.5?-1:1);
    }
    const inside=solidBox(e.x+3,e.y+3,10,10);
    const nx=e.x+(e.dx||1)*s;
    if(nx>=16&&nx<=W-32&&(inside||!solidBox(nx+3,e.y+3,10,10)))e.x=nx;else e.dx=-(e.dx||1);
    const ny=e.y+(e.dy||1)*s*0.7;
    if(ny>=8&&ny<=PH-24&&(inside||!solidBox(e.x+3,ny+3,10,10)))e.y=ny;else e.dy=-(e.dy||1);
    e.face=e.dx>0?1:-1;
  }else if(e.type==='drift'){
    e.ph+=0.03*sp;
    const tx=player.x,ty=player.y;
    e.x=clamp(e.x+Math.sign(tx-e.x)*0.26*sp,16,W-32);
    e.y=clamp(e.y+Math.sin(e.ph)*0.55+clamp((ty-e.y)*0.006*sp,-0.6,0.6),8,PH-24);
    e.face=tx>e.x?1:-1;
  }else if(e.type==='fly'){
    const s=0.6*sp;e.vx=Math.sign(e.vx||1)*s;e.vy=Math.sign(e.vy||1)*s;
    const inside=solidBox(e.x+2,e.y+2,12,12);
    const nx=e.x+e.vx;if(nx<16||nx>W-32||(!inside&&solidBox(nx+2,e.y+2,12,12)))e.vx=-e.vx;else e.x=nx;
    const ny=e.y+e.vy;if(ny<8||ny>PH-24||(!inside&&solidBox(e.x+2,ny+2,12,12)))e.vy=-e.vy;else e.y=ny;
    e.face=e.vx>0?1:-1;
  }
}
function updateDeads(){
  for(const d of deads){
    d.t++;d.vy=Math.min(d.vy+0.13,2.8);d.x+=d.vx;
    if(d.x<16){d.x=16;d.vx=-d.vx;}else if(d.x>W-32){d.x=W-32;d.vx=-d.vx;}
    const of=d.y+16;d.y+=d.vy;let land=false;
    if(d.vy>0&&d.t>28){const r=landRow(d.x,of,d.y+16,1);if(r>=0){d.y=r*T-16;land=true;}}
    if(d.y>PH)d.y-=PH+16;
    if(land||d.t>260){d.dead=true;const f=FRUIT[d.fruit];items.push({kind:f.k,v:f.v,x:d.x,y:d.y,vy:0,onGround:land,t:0});burst(d.x+8,d.y+10,'#ffd23f',6);}
  }
  deads=deads.filter(d=>!d.dead);
}
function updateItems(){
  for(const it of items){
    it.t++;
    if(!it.onGround){it.vy=Math.min(it.vy+GRAV,MAXFALL);const of=it.y+16;it.y+=it.vy;const r=landRow(it.x,of,it.y+16,1);if(r>=0){it.y=r*T-16;it.vy=0;it.onGround=true;}if(it.y>PH)it.y-=PH+16;}
    if(it.t>600)it.dead=true;
    else for(const p of players){if(p.dead||p.out)continue;if(rectHit(it.x+2,it.y+4,12,12,p.x+2,p.y+2,12,14)){it.dead=true;collect(it,p);break;}}
  }
  items=items.filter(i=>!i.dead);
}
function collect(it,p){
  if(POWERS[it.kind]){p[it.kind]=true;addScore(100,p);floatText(it.x+8,it.y,POWERS[it.kind],'#8ef5b0');sfx.power();}
  else{addScore(it.v,p);floatText(it.x+8,it.y,it.v,'#ffffff');sfx.collect();}
}
function spawnPower(){
  const kinds=Object.keys(POWERS).filter(k=>players.some(p=>!p.out&&!p[k]));if(!kinds.length)return;
  const spots=[];
  for(let r=4;r<ROWS-1;r++)for(let c=3;c<28;c++)if(grid[r*COLS+c]&&grid[r*COLS+c+1]&&!grid[(r-1)*COLS+c]&&!grid[(r-2)*COLS+c]&&!grid[(r-1)*COLS+c+1])spots.push([c,r]);
  if(!spots.length)return;
  const [c,r]=spots[Math.floor(rng()*spots.length)];
  items.push({kind:kinds[Math.floor(rng()*kinds.length)],v:0,x:c*T,y:r*T-16,vy:0,onGround:true,t:0});
  burst(c*T+8,r*T-8,'#8ef5b0',10);
}
function updateShots(){
  for(const s of shots){
    s.x+=s.vx;
    if(s.g){s.vy+=s.g;s.y+=s.vy;s.spin=(s.spin||0)+0.3;if(s.y>PH+8)s.dead=true;}
    if(s.laser){s.y+=s.vy;if(s.y>PH)s.dead=true;}
    if(s.boom){
      s.spin=(s.spin||0)+0.4;
      if(!s.back){s.x+=s.vx;if(s.x<22||s.x>W-22)s.back=true;}
      else{
        const o=s.owner;
        if(!o||enemies.indexOf(o)<0)s.dead=true;
        else{
          const dx=o.x+8-s.x,dy=o.y+6-s.y,d=Math.hypot(dx,dy)||1;
          s.x+=dx/d*2.5;s.y+=dy/d*2.5;
          if(d<8){s.dead=true;}
        }
      }
    }
    if(s.rock){
      s.spin=(s.spin||0)+0.25;
      const c=Math.floor((s.x+(s.vx>0?4:-4))/T),r=Math.floor((s.y-1)/T);
      if(c<2||c>29||(r>=0&&r<ROWS&&grid[r*COLS+c]))s.dead=true;
      else{const rb=Math.floor((s.y+6)/T);if(!(rb>=0&&rb<ROWS&&grid[rb*COLS+Math.floor(s.x/T)]))s.dead=true;}
      if(s.dead)burst(s.x,s.y,'#b0a18f',5);
    }
    if(s.x<16||s.x>W-16){if(s.g&&!s.bounced){s.bounced=true;s.vx=-s.vx*0.8;s.x=clamp(s.x,17,W-17);}else s.dead=true;}
    if(!s.dead)for(const p of players){if(p.out||p.dead||p.inv>0)continue;if(rectHit(s.x-3,s.y-3,6,6,p.x+4,p.y+4,8,11)){s.dead=true;killPlayer(p);break;}}
  }
  for(const s of shots)if(s.dead&&s.owner)s.owner.bottle=null;
  shots=shots.filter(s=>!s.dead);
}
function hitEnemies(x,y,w,h,chain,fx,fy){
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i],eb=eBox(e);
    if(!rectHit(x,y,w,h,eb[0],eb[1],eb[2],eb[3]))continue;
    enemies.splice(i,1);slay(e,fx===undefined?e.x+8:fx,fy===undefined?e.y+8:fy,chain);sfx.kill();
  }
}
function updateEffects(){
  for(const f of fires){
    f.vy=Math.min(f.vy+0.16,2.6);f.x=clamp(f.x+f.vx,16,W-32);
    const of=f.y+16;f.y+=f.vy;
    hitEnemies(f.x+3,f.y+3,10,10,f.chain,f.x+8,f.y+8);
    if(f.vy>0){const r=landRow(f.x,of,f.y+16,1);if(r>=0){flames.push({x:f.x,y:r*T-16,t:0,chain:f.chain});f.dead=true;}}
    if(f.y>PH){f.dead=true;}
  }
  fires=fires.filter(f=>!f.dead);
  for(const f of flames){
    f.t++;
    hitEnemies(f.x+2,f.y+4,12,12,f.chain,f.x+8,f.y+6);
    if(f.t>130)f.dead=true;
  }
  flames=flames.filter(f=>!f.dead);
  for(const b of bolts){
    b.t++;
    if(b.t<=30){
      const nx=clamp(b.x+b.dir*6,16,W-16);
      const x0=Math.min(b.x,nx),x1=Math.max(b.x,nx);
      hitEnemies(x0,b.y-5,Math.max(6,x1-x0),10,b.chain);
      b.x=nx;
      if(b.x<=16||b.x>=W-16)b.t=Math.max(b.t,26);
    }
    if(b.t>38)b.dead=true;
  }
  bolts=bolts.filter(b=>!b.dead);
}
function updateWaters(){
  for(const w of waters){
    w.t++;
    const col=clamp(Math.floor(w.x/T),0,COLS-1),rb=Math.floor((w.y+5)/T);
    const grounded=rb>=0&&rb<ROWS&&grid[rb*COLS+col];
    if(!grounded)w.y+=2.4;
    else{
      w.y=rb*T-4;
      const nx=w.x+w.dir*1.9,nc=Math.floor((nx+w.dir*3)/T),r=Math.floor(w.y/T);
      if(nc<2||nc>29||(r>=0&&r<ROWS&&grid[r*COLS+nc])){w.dir=-w.dir;w.turns=(w.turns||0)+1;}else w.x=nx;
    }
    if(w.t%2===0){w.trail.push([w.x,w.y]);if(w.trail.length>26)w.trail.shift();}
    for(let i=enemies.length-1;i>=0;i--){const e=enemies[i],eb=eBox(e);if(rectHit(w.x-6,w.y-6,12,12,eb[0],eb[1],eb[2],eb[3])){enemies.splice(i,1);if(e.bottle){e.bottle.dead=true;e.bottle=null;}w.carry.push(e);}}
    for(const e of w.carry)e.anim+=0.3;
    if(w.y>PH+4||w.t>420||(w.turns||0)>=3){
      w.done=true;
      for(const e of w.carry)slay(e,clamp(w.x,24,W-24),Math.min(w.y,PH-24),w.chain);
      if(w.carry.length)sfx.kill();
    }
  }
  waters=waters.filter(w=>!w.done);
}
function updateChaser(){
  if(!chaser)return;
  if(clearing){chaser.y-=2;if(chaser.y<-40)chaser=null;return;}
  const tp=nearestPlayer(chaser.x,chaser.y);
  const dx=tp.x-chaser.x,dy=tp.y-chaser.y,d=Math.hypot(dx,dy)||1;
  chaser.sp=Math.min(1.3,chaser.sp+0.0006);chaser.x+=dx/d*chaser.sp;chaser.y+=dy/d*chaser.sp;
  for(const p of players){if(!p.out&&!p.dead&&p.inv<=0&&rectHit(chaser.x+2,chaser.y+3,12,10,p.x+4,p.y+4,8,11))killPlayer(p);}
}

/* ---------- mode updates ---------- */
function updatePlay(){
  for(const p of players)updatePlayer(p);
  if(mode!=='play')return;
  if(players.every(p=>p.out||p.dead)){updateFx();return;}
  for(const e of enemies)updateEnemy(e);
  updateBubbles();bubblePlayer();updateEffects();updateWaters();updateDeads();updateItems();updateShots();updateChaser();updateFx();
  for(const p of players){
    if(p.out||p.dead||p.inv>0)continue;
    for(const e of enemies){const eb=eBox(e);if(rectHit(p.x+4,p.y+4,8,11,eb[0],eb[1],eb[2],eb[3])){killPlayer(p);break;}}
  }
  if(!clearing){
    levelTime++;
    const hurryAt=Math.max(1320,2100-level*20);
    if(!hurry&&levelTime>=hurryAt){hurry=true;enemies.forEach(e=>e.angry=true);banner={s:'HURRY UP!',t:130};sfx.hurry();}
    if(hurry&&!chaser&&levelTime>=hurryAt+540){chaser={x:W/2-8,y:-16,sp:0.35};sfx.chaser();}
    if(powerAt>=0&&levelTime===powerAt)spawnPower();
    if(enemies.length===0&&!bubbles.some(b=>b.enemy)&&deads.length===0&&fires.length===0&&waters.length===0){clearing=true;clearTimer=0;}
  }else{
    clearTimer++;
    if(clearTimer>=210)startTransition();
  }
  if(banner&&--banner.t<=0)banner=null;
}
function startTransition(){
  trans={layer:tileLayer,from:players.map(p=>({x:p.x,y:p.y}))};
  level++;loadLevel(level);mode='trans';modeT=0;sfx.clear();
}
function tick(){
  frame++;
  readInput();
  if(!paused){
    modeT++;
    if(mode==='title'){
      if(input.upPressed){menuSel=(menuSel+MENU.length-1)%MENU.length;sfx.pop();}
      if(input.downPressed){menuSel=(menuSel+1)%MENU.length;sfx.pop();}
      if(input.leftPressed||input.rightPressed){if(menuSel===3)setCast(cast==='classic'?'modern':'classic');else if(menuSel===2)setPlayers(!twoP);else{menuSel=1;sfx.pop();}}
      if(modeT>10&&input.confirmPressed)menuAction(menuSel);
    }
    else if(mode==='select'){
      const stepX=(input.rightPressed?1:0)-(input.leftPressed?1:0),stepY=(input.downPressed?1:0)-(input.upPressed?1:0);
      if(stepX)pickRound(selLevel+stepX);
      if(stepY)pickRound(selLevel+stepY*PVCOL);
      const hx=(input.right?1:0)-(input.left?1:0);
      if(hx){selHold++;if(selHold>20&&selHold%5===0)pickRound(selLevel+hx);}else selHold=0;
      if(modeT>10&&input.confirmPressed){setRound(selLevel);startGame();}
    }
    else if(mode==='ready'){if(modeT>=100){mode='play';modeT=0;}}
    else if(mode==='trans'){updateFx();if(modeT>=110){mode='ready';modeT=0;}}
    else if(mode==='play'){updatePlay();}
    else if(mode==='gameover'){if(modeT>70&&(input.startPressed||input.jumpPressed||input.firePressed)){mode='title';modeT=0;}}
  }
  latch.clear();
}

const R=Math.round;

function drawWorld(){
  for(const it of items){if(it.t>480&&(frame>>2)%2)continue;const s=SP.items[it.kind];ctx.drawImage(s.r,R(it.x),R(it.y)+TOP);}

  for(const b of bubbles){

  }
  for(const p of players){
    if(p.out)continue;
    if(p.dead){const s=(p.id?SP.pip2:SP.pip)[0];ctx.save();ctx.translate(R(p.x)+8,R(p.y)+8+TOP);ctx.rotate(Math.min(p.deadT,40)*0.4);ctx.drawImage(s.r,-8+s.ox,-8+s.oy);ctx.restore();}
    else if(!(p.inv>0&&(frame>>2)%2))drawPip(p.x,p.y,p.face,p.blow>0,p.onGround?Math.floor(p.anim)%2:0,p.id);
  }
  for(const s of shots){

      const sp2=Math.floor((s.spin||0))%2;ctx.fillStyle='#7d7263';ctx.fillRect(R(s.x)-1+(sp2?1:-1),R(s.y)-1+TOP,3,2);

    drawFx();
  }
  else{
    ctx.drawImage(tileLayer,0,TOP);drawWorld();drawFx();
  }
  ctx.restore();
  drawHUD();
  if(mode!=='title'&&mode!=='select')drawFloorInfo();
  if(mode==='ready'){bigTxt('ROUND '+level,W/2,TOP+82,'#ffd23f');if((modeT>>4)%2===0)txt('READY?',W/2,TOP+106,'#ffffff',8,'center');}
  if(mode==='play'){
    if(banner&&(banner.t>>3)%2===0)bigTxt(banner.s,W/2,TOP+90,'#ff5a7a');
    if(clearing&&clearTimer>40)txt('ROUND CLEAR!',W/2,TOP+96,'#8ef5b0',8,'center');
  }
  if(mode==='gameover'){
    ctx.fillStyle='rgba(10,6,20,.78)';ctx.fillRect(0,TOP,W,PH);
    bigTxt('GAME OVER',W/2,TOP+62,'#ff5a7a');
    if(players.length>1){txt('1P '+pad(players[0].score,7),W/2,TOP+92,'#4fd18b',8,'center');txt('2P '+pad(players[1].score,7),W/2,TOP+104,'#7ec8ff',8,'center');}
    else txt('SCORE '+pad(bestScore(),7),W/2,TOP+96,'#ffffff',8,'center');
    txt('ROUND '+level,W/2,TOP+118,'#7ee8ff',8,'center');
    if(bestScore()>hiAtStart&&bestScore()>0&&(frame>>4)%2===0)txt('NEW HIGH SCORE!',W/2,TOP+132,'#ffd23f',8,'center');
    if(modeT>70&&(frame>>5)%2===0)txt(document.body.classList.contains('touch')?'TAP TO CONTINUE':'PRESS SPACE',W/2,TOP+160,'#d3c8ea',8,'center');
  }
  if(paused){
    ctx.fillStyle='rgba(10,6,20,.78)';ctx.fillRect(0,TOP,W,PH);
    bigTxt('PAUSED',W/2,TOP+74,'#7ee8ff');
    txt(document.body.classList.contains('touch')?'Tap the screen to resume':'Press P to resume',W/2,TOP+104,'#d3c8ea',8,'center');
    ctx.fillStyle='rgba(20,12,28,.9)';ctx.fillRect(84,TOP+124,88,18);
    ctx.strokeStyle='#ff7ab3';ctx.lineWidth=1;ctx.strokeRect(84.5,TOP+124.5,87,17);
    txt('QUIT',W/2,TOP+130,'#ffffff',8,'center');
    txt(document.body.classList.contains('touch')?'Tap QUIT for the menu':'Esc for the menu',W/2,TOP+150,'#6f6390',8,'center');
  }
}

/* ---------- boot ---------- */
titleLayer=makeTileLayer(buildGrid(LV[0]),PALS[0]);
setMuted(muted);
resize();
let last=performance.now(),acc=0;const STEP=1000/60;
function loop(now){
  acc+=Math.min(250,now-last);last=now;let n=0;
  while(acc>=STEP&&n<5){tick();acc-=STEP;n++;}
  if(n===5)acc=0;
  try{render();}catch(err){console.error(err);}
  schedMusic();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- install & offline ---------- */
const btnInstall=document.getElementById('btnInstall'),hintEl=document.getElementById('hint');
let installEvt=null,hintTimer=0;
const isInstalled=()=>{try{return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true;}catch(e){return false;}};
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function showHint(msg){hintEl.textContent=msg;hintEl.hidden=false;clearTimeout(hintTimer);hintTimer=setTimeout(()=>{hintEl.hidden=true;},6000);}
hintEl.addEventListener('click',()=>{hintEl.hidden=true;});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;if(!isInstalled())btnInstall.hidden=false;});
addEventListener('appinstalled',()=>{installEvt=null;btnInstall.hidden=true;showHint('Popling is installed. Open it from your home screen or apps list.');});
if(isIOS&&!isInstalled())btnInstall.hidden=false;
btnInstall.addEventListener('click',async()=>{
  btnInstall.blur();
  if(installEvt){
    const e=installEvt;installEvt=null;
    try{e.prompt();const r=await e.userChoice;if(r&&r.outcome==='accepted')btnInstall.hidden=true;}catch(err){}
  }else if(isIOS){
    showHint('To install: tap the Share button, then Add to Home Screen.');
  }
});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  addEventListener('load',()=>{try{navigator.serviceWorker.register('./sw.js').catch(()=>{});}catch(e){}});
}
/*DBG*/
})();
</script>
